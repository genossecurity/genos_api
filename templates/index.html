<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Genos Scanner</title>
<script>
  (function () {
    var t = localStorage.getItem('genos-theme') ||
      (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --bg: #0d1117; --bg-image: none; --panel: #161b22; --panel2: #1c2128; --inset: #0f141c; --mark: #101722;
    --ink: #e6edf3; --soft: #c9d1d9; --muted: #8b949e; --border: #30363d;
    --benign: #3fb950; --suspicious: #d29922; --malicious: #f85149; --context: #d29922;
    --accent: #58a6ff; --accent-ink: #04121f; --shadow: none;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef3f8; --bg-image: linear-gradient(135deg, #dfeaf5 0%, #f4f7fb 55%, #f8f4f6 100%);
    --panel: #ffffff; --panel2: #f8fafc; --inset: #f8fafc; --mark: #e8f1fa;
    --ink: #0f172a; --soft: #334155; --muted: #64748b; --border: #e2e8f0;
    --benign: #15803d; --suspicious: #b45309; --malicious: #dc2626; --context: #b45309;
    --accent: #0ea5e9; --accent-ink: #ffffff; --shadow: 0 6px 24px rgba(15,23,42,.07);
  }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg) var(--bg-image) fixed; min-height: 100vh; color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  code, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .shell { width: min(880px, calc(100vw - 32px)); margin: 0 auto; padding: 40px 0 80px; }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-text { flex: 1; }
  .theme-toggle { display: inline-flex; border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 3px; }
  .theme-toggle button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .78rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .theme-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 7px; background: var(--mark); color: var(--accent); font-weight: 900; }
  .brand-title { font-weight: 800; letter-spacing: -.02em; font-size: 1.05rem; }
  .brand-sub { color: var(--muted); font-size: .8rem; }
  .api-link { color: var(--accent); font-weight: 700; text-decoration: none; padding: 6px 10px; }
  .api-link:hover { text-decoration: underline; }

  /* ── Command Input Box ───────────────────────────────── */
  .scan-box { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
  .scan-box label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  textarea#cmdInput {
    width: 100%; min-height: 96px; resize: vertical; background: var(--inset); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; line-height: 1.5; outline: none;
  }
  textarea#cmdInput:focus { border-color: var(--accent); }
  .scan-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  button#scanBtn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px; padding: 10px 22px;
    font-weight: 800; font-size: .88rem; cursor: pointer; letter-spacing: .01em;
  }
  button#scanBtn:hover { filter: brightness(1.08); }
  button#scanBtn:disabled { opacity: .55; cursor: wait; }
  #scanStatus { color: var(--muted); font-size: .8rem; }

  /* ── Results Area ────────────────────────────────────── */
  #results { margin-top: 28px; }
  #results.hidden { display: none; }

  .verdict-card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; background: var(--panel); box-shadow: var(--shadow);
  }
  .verdict-left { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; min-width: 0; }
  .verdict-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    font-weight: 800; font-size: .95rem; letter-spacing: .02em; text-transform: uppercase;
  }
  .verdict-pill.benign { background: rgba(63,185,80,.14); color: var(--benign); border: 1px solid rgba(63,185,80,.4); }
  .verdict-pill.suspicious { background: rgba(210,153,34,.14); color: var(--suspicious); border: 1px solid rgba(210,153,34,.4); }
  .verdict-pill.context_dependent { background: rgba(210,153,34,.14); color: var(--context); border: 1px solid rgba(210,153,34,.4); }
  .verdict-pill.malicious { background: rgba(248,81,73,.14); color: var(--malicious); border: 1px solid rgba(248,81,73,.4); }
  .verdict-conf { font-size: 1.6rem; font-weight: 900; }
  .verdict-meta { flex-shrink: 0; color: var(--muted); font-size: .8rem; text-align: right; }
  .verdict-meta div + div { margin-top: 2px; }
  .verdict-summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; padding: 0; border-radius: 999px; overflow: hidden; }
  .verdict-stage-section, .verdict-classification-section { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px; min-width: 0; padding: 20px 22px; font-size: 1rem; line-height: 1.5; }
  .verdict-stage-label { color: var(--soft); font-weight: 400; }
  .verdict-stage { color: var(--accent); font-size: 1rem; font-weight: 800; line-height: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .verdict-stage:hover { filter: brightness(1.2); }
  .verdict-stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .verdict-classification-section { align-self: stretch; border-left: 1px solid var(--border); }
  .verdict-summary .verdict-pill { padding: 0; border: 0; background: transparent; font-size: inherit; letter-spacing: normal; text-transform: none; }
  .verdict-summary .verdict-conf { color: var(--soft); font-size: inherit; font-weight: 700; white-space: nowrap; }
  .verdict-time { color: var(--muted); white-space: nowrap; }
  @media (max-width: 640px) {
    .verdict-summary { grid-template-columns: minmax(0, 1fr); border-radius: 24px; }
    .verdict-classification-section { border-left: 0; border-top: 1px solid var(--border); }
  }
  @media (max-width: 540px) {
    .verdict-card { flex-direction: column; align-items: flex-start; }
    .verdict-meta { text-align: left; }
  }

  .decoded-box { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--inset); padding: 12px 14px; }
  .decoded-box .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; font-weight: 700; }
  .decoded-box code { color: var(--soft); word-break: break-all; white-space: pre-wrap; }

  /* ── Family Cards (per-family IOC grouping, no overlap) ──────────── */
  .families { margin-top: 20px; display: grid; gap: 14px; }
  .family-card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; box-shadow: var(--shadow); }
  .family-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: var(--panel2); border-bottom: 1px solid var(--border); }
  .family-name { font-weight: 800; font-size: .95rem; }
  .family-prob { font-weight: 800; color: var(--accent); font-size: .9rem; }
  .family-body { padding: 14px 18px; display: grid; gap: 10px; }
  .ioc-group { display: grid; gap: 6px; }
  .ioc-group-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .ioc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ioc-chip { display: inline-flex; align-items: center; background: var(--inset); border: 1px solid var(--border); color: var(--soft); border-radius: 6px; padding: 4px 9px; font-size: .78rem; }
  .ioc-chip.mono { font-family: "SFMono-Regular", Consolas, monospace; }


  .section { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; box-shadow: var(--shadow); }
  .section-title { padding: 10px 18px; background: var(--panel2); border-bottom: 1px solid var(--border); color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
  .section-body { padding: 14px 18px; display: grid; gap: 10px; }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kv .k { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .kv .v { margin-top: 2px; font-weight: 700; word-break: break-all; }
  table.inv { width: 100%; border-collapse: collapse; font-size: .82rem; }
  table.inv th { text-align: left; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 6px 0; }
  table.inv td { padding: 6px 8px 6px 0; border-top: 1px solid var(--border); vertical-align: top; }
  .role { display: inline-block; margin-right: 4px; padding: 1px 7px; border-radius: 999px; font-size: .68rem; font-weight: 800; background: rgba(88,166,255,.14); color: var(--accent); border: 1px solid rgba(88,166,255,.35); }
  .role.lolbin { background: rgba(210,153,34,.14); color: var(--suspicious); border-color: rgba(210,153,34,.4); }

  .empty-note { color: var(--muted); font-size: .82rem; padding: 4px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: .76rem; text-align: center; }
</style>
</head>
<body>
<div class="shell">

  <div class="brand">
    <div class="brand-mark">G</div>
    <div class="brand-text">
      <div class="brand-title">Genos Scanner</div>
      <div class="brand-sub">Command security analysis</div>
    </div>
    <a class="api-link" href="{{ url_for('api_builder') }}">API builder</a>
    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button type="button" data-theme-btn="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-btn="dark" aria-pressed="true">Dark</button>
    </div>
  </div>

  <div class="scan-box">
    <label for="cmdInput">Command</label>
    <textarea id="cmdInput" placeholder="Paste a shell or PowerShell command…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="scan-row">
      <button id="scanBtn" type="button">Scan</button>
      <span id="scanStatus">Ready</span>
    </div>
  </div>

  <div id="results" class="hidden"></div>

  <footer>Genos security analysis engine — Benign / Suspicious / Context-Dependent triage across 11 MITRE ATT&amp;CK tactic families</footer>
</div>

<script>
(function () {
  const cmdInput = document.getElementById('cmdInput');
  const scanBtn = document.getElementById('scanBtn');
  const scanStatus = document.getElementById('scanStatus');
  const results = document.getElementById('results');
  const STAGE_MITRE_URLS = {
    'Execution': 'https://attack.mitre.org/tactics/TA0002/',
    'Persistence': 'https://attack.mitre.org/tactics/TA0003/',
    'Privilege Escalation': 'https://attack.mitre.org/tactics/TA0004/',
    'Defense Evasion': 'https://attack.mitre.org/tactics/TA0005/',
    'Credential Access': 'https://attack.mitre.org/tactics/TA0006/',
    'Discovery / Recon': 'https://attack.mitre.org/tactics/TA0007/',
    'Lateral Movement': 'https://attack.mitre.org/tactics/TA0008/',
    'Collection / Staging': 'https://attack.mitre.org/tactics/TA0009/',
    'C2 / Remote Access': 'https://attack.mitre.org/tactics/TA0011/',
    'Payload Retrieval': 'https://attack.mitre.org/techniques/T1105/',
    'Exfiltration': 'https://attack.mitre.org/tactics/TA0010/',
    'Impact': 'https://attack.mitre.org/tactics/TA0040/',
  };

  const themeButtons = document.querySelectorAll('[data-theme-btn]');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('genos-theme', theme);
    themeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === theme)));
  }
  themeButtons.forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.themeBtn)));
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

  // Maps evidence / triggered features / fired rules into the 11 MITRE ATT&CK
  // tactic families so every family shows only its own relevant indicators.
  const FAMILY_KEYWORDS = {
    'Execution': ['runs_interpreter', 'executes_inline_code', 'inline_code', 'shell_spawn', 'eval_exec', 'interpreter', 'run_script_interpreter', 'execute_inline_code'],
    'Persistence': ['persistence', 'scheduled_task', 'registry_autorun', 'schtasks', 'cron', 'rc.local', 'service', 'autorun', 'establish_persistence'],
    'Privilege Escalation': ['privilege_escalation', 'privesc', 'setuid', 'sudoers', 'attempt_privilege_escalation'],
    'Defense Evasion': ['obfuscation', 'encoded_payload', 'base64_or_encoded_exec', 'defense_impairment', 'signed_proxy', 'lolbin', 'encode_payload', 'obfuscate_command', 'disable_defenses', 'use_signed_proxy'],
    'Credential Access': ['credential', 'reads_credential_store', 'shadow', 'mimikatz', 'secretsdump', 'access_credential_store', 'credential_dumping'],
    'Discovery': ['enumeration_recon', 'enumerates_identity', 'enumerates_network_config', 'network_enum', 'process_enum', 'enumerate_identity', 'enumerate_network', 'enumerate_environment'],
    'Lateral Movement': ['remote_execution_or_session', 'tunneling', 'remote_session', 'establish_tunnel'],
    'Command-and-Control / Payload Retrieval': ['downloads_remote_resource', 'download', 'pipe_to_shell', 'reverse_shell', 'download_remote_resource', 'reverse_shell_pattern'],
    'Exfiltration': ['exfil_data_movement', 'transfers_file_to_remote', 'transfer_file_remote', 'exfiltrate_data', 'remote_transfer'],
    'Impact': ['destructive_write', 'deletes_shadow_copies', 'delete_shadow_copies', 'archive_or_bulk_copy', 'archive_or_stage_data'],
  };

  function matchesFamily(familyName, key) {
    const kws = FAMILY_KEYWORDS[familyName] || [];
    const lowered = String(key).toLowerCase();
    return kws.some(kw => lowered.includes(kw));
  }

  function chip(text, mono) {
    const span = document.createElement('span');
    span.className = 'ioc-chip' + (mono ? ' mono' : '');
    span.textContent = text;
    return span;
  }

  function buildIocGroup(label, items, mono) {
    if (!items || !items.length) return null;
    const wrap = document.createElement('div');
    wrap.className = 'ioc-group';
    const l = document.createElement('div');
    l.className = 'ioc-group-label';
    l.textContent = label;
    wrap.appendChild(l);
    const chips = document.createElement('div');
    chips.className = 'ioc-chips';
    items.forEach(item => chips.appendChild(chip(item, mono)));
    wrap.appendChild(chips);
    return wrap;
  }

  // Artifact types each family owns; anything not claimed by a rendered family goes to "Other IOCs".
  const FAMILY_ARTIFACTS = {
    'Execution': ['files'],
    'Persistence': ['registry', 'files'],
    'Privilege Escalation': ['files'],
    'Defense Evasion': ['files', 'registry'],
    'Credential Access': ['files'],
    'Discovery': ['network', 'ports'],
    'Lateral Movement': ['network', 'ports'],
    'Command-and-Control / Payload Retrieval': ['network', 'ports', 'files'],
    'Exfiltration': ['network', 'ports', 'files'],
    'Impact': ['files', 'registry'],
  };

  function artifactGroup(type, evidence) {
    if (type === 'network') return buildIocGroup('Network', [...(evidence.urls || []), ...(evidence.domains || []), ...(evidence.ips || [])], true);
    if (type === 'ports') return buildIocGroup('Ports', evidence.ports || [], true);
    if (type === 'registry') return buildIocGroup('Registry', evidence.registry_paths || [], true);
    if (type === 'files') return buildIocGroup('Files', evidence.file_paths || [], true);
    return null;
  }

  function collectFamilyIndicators(familyName, data, claimed) {
    const evidence = data.evidence || {};
    const triggered = data.triggered_features || [];
    const firedRules = evidence.fired_rules || [];
    const semanticFeatures = evidence.semantic_features || [];

    const flags = new Set();
    triggered.filter(f => matchesFamily(familyName, f)).forEach(f => flags.add(f.replace(/^has_/, '').replace(/_/g, ' ')));
    firedRules.filter(r => matchesFamily(familyName, r)).forEach(r => flags.add(r));
    semanticFeatures.filter(s => matchesFamily(familyName, s)).forEach(s => flags.add(s.replace(/_/g, ' ')));

    const groups = [];
    const flagGroup = buildIocGroup('Indicators', Array.from(flags));
    if (flagGroup) groups.push(flagGroup);

    (FAMILY_ARTIFACTS[familyName] || []).forEach(type => {
      const g = artifactGroup(type, evidence);
      if (g) { groups.push(g); claimed.add(type); }
    });
    return groups;
  }

  function section(title) {
    const sec = document.createElement('div');
    sec.className = 'section';
    const t = document.createElement('div');
    t.className = 'section-title';
    t.textContent = title;
    const body = document.createElement('div');
    body.className = 'section-body';
    sec.appendChild(t);
    sec.appendChild(body);
    return { sec, body };
  }

  function renderProfile(data) {
    const ev = data.evidence || {};
    const rows = [
      ['OS / Platform', ev.platform],
      ['Binary', ev.executable],
      ['Subcommand', ev.subcommand],
      ['Interpreter', ev.interpreter],
      ['Execution style', ev.execution_style],
      ['Artifact type', ev.primary_artifact_type],
      ['Pipe', ev.has_pipe ? 'yes' : null],
      ['Chain', ev.has_chain ? 'yes' : null],
      ['Redirect', ev.has_redirect ? 'yes' : null],
      ['Obfuscated', ev.uses_obfuscation ? 'yes' : null],
    ].filter(r => r[1]);
    if (!rows.length) return;
    const { sec, body } = section('Command profile');
    const grid = document.createElement('div');
    grid.className = 'kv-grid';
    rows.forEach(([k, v]) => {
      const kv = document.createElement('div');
      kv.className = 'kv';
      kv.innerHTML = '<div class="k"></div><div class="v"></div>';
      kv.querySelector('.k').textContent = k;
      kv.querySelector('.v').textContent = v;
      grid.appendChild(kv);
    });
    body.appendChild(grid);
    results.appendChild(sec);
  }

  function renderBinaries(data) {
    const bins = (data.evidence || {}).binaries || [];
    if (!bins.length) return;
    const { sec, body } = section(`Binary inventory (${bins.length})`);
    const table = document.createElement('table');
    table.className = 'inv';
    table.innerHTML = '<thead><tr><th>Binary</th><th>Roles</th><th>Flags</th></tr></thead><tbody></tbody>';
    const tbody = table.querySelector('tbody');
    bins.forEach(b => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.className = 'mono';
      tdName.textContent = b.binary;
      const tdRoles = document.createElement('td');
      (b.roles || []).forEach(r => {
        const span = document.createElement('span');
        span.className = 'role ' + r;
        span.textContent = r;
        tdRoles.appendChild(span);
      });
      const tdFlags = document.createElement('td');
      tdFlags.className = 'mono';
      tdFlags.textContent = (b.flags || []).join(' ') || '—';
      tr.append(tdName, tdRoles, tdFlags);
      tbody.appendChild(tr);
    });
    body.appendChild(table);
    results.appendChild(sec);
  }

  function renderFlags(data) {
    const ev = data.evidence || {};
    const groups = [
      buildIocGroup('High-signal flags', ev.high_signal_flags || [], true),
      buildIocGroup('Routing features', (data.triggered_features || []).map(f => f.replace(/^has_/, '').replace(/_/g, ' '))),
      buildIocGroup('Fired rules', ev.fired_rules || []),
      buildIocGroup('Obfuscation markers', ev.obfuscation_markers || []),
    ].filter(Boolean);
    if (!groups.length) return;
    const { sec, body } = section('Flags');
    groups.forEach(g => body.appendChild(g));
    results.appendChild(sec);
  }

  function renderBenign(data) {
    const card = document.createElement('div');
    card.className = 'verdict-card';

    const left = document.createElement('div');
    left.className = 'verdict-left';
    const pill = document.createElement('span');
    pill.className = 'verdict-pill benign';
    pill.textContent = 'Benign';
    left.appendChild(pill);
    const conf = document.createElement('span');
    conf.className = 'verdict-conf';
    conf.textContent = `${Number(data.label_confidence).toFixed(1)}%`;
    left.appendChild(conf);
    card.appendChild(left);

    const meta = document.createElement('div');
    meta.className = 'verdict-meta';
    if (typeof data.elapsed_ms === 'number') {
      const t = document.createElement('div');
      t.textContent = `${data.elapsed_ms} ms`;
      meta.appendChild(t);
    }
    card.appendChild(meta);
    results.appendChild(card);
  }

  function renderSuspicious(data) {
    const label = data.label || 'Suspicious';
    const pillClass = label.toLowerCase().includes('context') ? 'context_dependent'
      : label.toLowerCase().includes('malicious') ? 'malicious' : 'suspicious';

    const card = document.createElement('div');
    card.className = 'verdict-card verdict-summary';

    const left = document.createElement('div');
    left.className = 'verdict-stage-section';
    const stageLabel = document.createElement('span');
    stageLabel.className = 'verdict-stage-label';
    stageLabel.textContent = 'MITRE Stage:';
    left.appendChild(stageLabel);
    if (data.attack_stage) {
      const stage = document.createElement('a');
      stage.className = 'verdict-stage';
      stage.textContent = data.attack_stage;
      const stageUrl = STAGE_MITRE_URLS[data.attack_stage];
      stage.href = stageUrl || 'https://attack.mitre.org/tactics/';
      stage.target = '_blank';
      stage.rel = 'noopener noreferrer';
      stage.title = stageUrl ? `View ${data.attack_stage} in MITRE ATT&CK` : 'Explore MITRE ATT&CK tactics';
      left.appendChild(stage);
    }
    card.appendChild(left);

    const right = document.createElement('div');
    right.className = 'verdict-classification-section';
    const pill = document.createElement('span');
    pill.className = 'verdict-pill ' + pillClass;
    pill.textContent = label.replace(/_/g, ' ');
    right.appendChild(pill);
    const conf = document.createElement('span');
    conf.className = 'verdict-conf';
    conf.textContent = `${Number(data.label_confidence).toFixed(1)}%`;
    right.appendChild(conf);
    if (typeof data.elapsed_ms === 'number') {
      const t = document.createElement('span');
      t.className = 'verdict-time';
      t.textContent = `${data.elapsed_ms} ms`;
      right.appendChild(t);
    }
    card.appendChild(right);
    results.appendChild(card);

    if (data.deobfuscated_cmd || data.decoded_payload) {
      const box = document.createElement('div');
      box.className = 'decoded-box';
      const l = document.createElement('div');
      l.className = 'label';
      l.textContent = 'Deobfuscated Command';
      box.appendChild(l);
      const code = document.createElement('code');
      code.textContent = data.deobfuscated_cmd || data.decoded_payload;
      box.appendChild(code);
      results.appendChild(box);
    }

    renderProfile(data);
    renderBinaries(data);
    renderFlags(data);

    // Per-family cards, each with only its own relevant IOCs
    const claimed = new Set();
    const families = document.createElement('div');
    families.className = 'families';

    const predicted = (data.attack_families && data.attack_families.predicted_families) || [];
    const allScores = (data.attack_families && data.attack_families.all_family_scores) || [];
    const familyList = predicted.length ? predicted : allScores.filter(f => f.family !== 'Benign Admin').slice(0, 1);

    let renderedAny = false;
    familyList.forEach(f => {
      const groups = collectFamilyIndicators(f.family, data, claimed);
      if (!groups.length) return; // eliminate unused/empty family space
      renderedAny = true;

      const card = document.createElement('div');
      card.className = 'family-card';

      const head = document.createElement('div');
      head.className = 'family-head';
      const name = document.createElement('span');
      name.className = 'family-name';
      name.textContent = f.family;
      head.appendChild(name);
      const prob = document.createElement('span');
      prob.className = 'family-prob';
      prob.textContent = `${Number(f.probability).toFixed(1)}%`;
      head.appendChild(prob);
      card.appendChild(head);

      const body = document.createElement('div');
      body.className = 'family-body';
      groups.forEach(g => body.appendChild(g));
      card.appendChild(body);

      families.appendChild(card);
    });

    if (renderedAny) {
      results.appendChild(families);
    }

    // IOCs not owned by any rendered family
    const ev = data.evidence || {};
    const others = ['network', 'ports', 'registry', 'files']
      .filter(t => !claimed.has(t)).map(t => artifactGroup(t, ev)).filter(Boolean);
    if (others.length) {
      const { sec, body } = section('Other IOCs');
      others.forEach(g => body.appendChild(g));
      results.appendChild(sec);
    }

    if (!renderedAny && !others.length && data.analyst_hint) {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = data.analyst_hint;
      results.appendChild(note);
    }
  }

  function renderResults(data) {
    results.innerHTML = '';
    results.classList.remove('hidden');
    const label = (data.label || '').toLowerCase();
    if (label === 'benign') {
      renderBenign(data);
    } else {
      renderSuspicious(data);
    }
  }

  function renderError(message) {
    results.innerHTML = '';
    results.classList.remove('hidden');
    const card = document.createElement('div');
    card.className = 'verdict-card';
    card.textContent = message;
    results.appendChild(card);
  }

  async function runScan() {
    const command = cmdInput.value.trim();
    if (!command) {
      scanStatus.textContent = 'Enter a command to scan.';
      return;
    }

    scanBtn.disabled = true;
    scanStatus.textContent = 'Scanning…';

    try {
      const resp = await fetch('/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        renderError(data.error || 'Scan failed.');
        scanStatus.textContent = 'Error';
        return;
      }
      renderResults(data);
      scanStatus.textContent = 'Done';
    } catch (err) {
      renderError('Network error: ' + err.message);
      scanStatus.textContent = 'Error';
    } finally {
      scanBtn.disabled = false;
    }
  }

  scanBtn.addEventListener('click', runScan);
  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      runScan();
    }
  });
})();
</script>
</body>
</html>
